# Keep models/translations/**/*.json (the translation memory) in sync with the
# en + zh mirrors. When a PR that hand-edits en + zh is merged, the memory goes
# stale and the daily translate pipeline (schedule_yaml_translate.yml) would
# otherwise re-translate fields that were already translated by hand. This runs
# on merge and commits any memory-only corrections directly to main.
name: Sync Translation Memory

on:
  push:
    branches: [main]
    paths:
      - 'models/en/**'
      - 'models/zh/**'

permissions:
  contents: write

concurrency:
  group: sync-translation-memory
  cancel-in-progress: true

jobs:
  sync-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-translate.txt

      - name: Resync translation memory
        run: python scripts/translate/resync_memory.py --all

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A models/translations
          if git diff --cached --quiet; then
            echo "No translation memory changes."
            exit 0
          fi
          git commit -s -m "[i18n] sync translation memory from en/zh"
          git push
