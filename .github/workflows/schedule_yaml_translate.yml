name: Auto Recipe Translate

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch for the PR'
        required: false
        default: 'main'
        type: string
      force:
        description: 'Force full regeneration of all translations (discard existing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: recipe-translate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.target_branch || 'main' }}

      - name: Setup git and branch
        run: |
          TARGET_BRANCH="${{ inputs.target_branch || 'main' }}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV
          # Fixed branch: each run force-pushes to the same branch and updates
          # the same PR instead of opening a new one every day.
          BRANCH_NAME="auto-pr/zh-translate"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -B "${BRANCH_NAME}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-translate.txt

      - name: Detect fields to translate
        id: detect
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python scripts/translate/detect_yaml_changes.py --state-dir .translate $FORCE_FLAG

          [ ! -f .translate/detect.json ] && echo "No detect manifest" && exit 0
          has_changes=$(python3 -c "import json; print(json.load(open('.translate/detect.json')).get('has_changes', False))")
          echo "has_changes=$has_changes" >> $GITHUB_OUTPUT

      - name: Translate fields
        if: steps.detect.outputs.has_changes == 'True'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/translate/yaml_translate.py --state-dir .translate

      - name: Apply translations (rebuild zh + memory)
        if: steps.detect.outputs.has_changes == 'True'
        run: |
          python scripts/translate/apply_translations.py --state-dir .translate

      - name: Validate generated YAML
        if: steps.detect.outputs.has_changes == 'True'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.detect.outputs.has_changes == 'True'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.detect.outputs.has_changes == 'True'
        run: pnpm install --frozen-lockfile

      - name: Validate
        if: steps.detect.outputs.has_changes == 'True'
        run: pnpm validate

      - name: Stage translated files
        if: steps.detect.outputs.has_changes == 'True'
        id: stage
        run: |
          git add models/zh models/translations
          if git diff --cached --quiet; then
            echo "无文件需要翻译"
            echo "has_staged=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_staged=true" >> $GITHUB_OUTPUT
          count=$(git diff --cached --name-only | wc -l)
          file_list=$(git diff --cached --name-only | sed 's/^/- <code>/; s/$/<\/code>/')
          echo "count=$count" >> $GITHUB_OUTPUT
          {
            echo "file_list<<EOF"
            echo "$file_list"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.detect.outputs.has_changes == 'True' && steps.stage.outputs.has_staged == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git commit -s -m "[zh] Auto-translate recipe files"
          git push -f -u origin "${{ env.BRANCH_NAME }}"

      - name: Create PR
        if: steps.detect.outputs.has_changes == 'True' && steps.stage.outputs.has_staged == 'true'
        uses: actions/github-script@v9
        env:
          FILE_LIST: ${{ steps.stage.outputs.file_list }}
          FILE_COUNT: ${{ steps.stage.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_HEAD: ${{ env.BRANCH_NAME }}
          PR_BASE: ${{ env.TARGET_BRANCH }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const branchLabel = process.env.PR_BASE.split('/').pop();
            const date = new Date().toISOString().slice(0, 10);
            const prTitle = branchLabel === 'main'
              ? '[zh] Translated recipe files ' + date
              : '[' + branchLabel + '][zh] Translated recipe files ' + date;
            const prBody = '## Auto-Translation Summary\n\n' +
              'Translated **' + process.env.FILE_COUNT + '** file(s):\n\n' +
              process.env.FILE_LIST + '\n---\n\n' +
              '[Workflow run](' + process.env.RUN_URL + ')';

            // Fixed branch: update the existing open PR if present, else create.
            const headRef = context.repo.owner + ':' + process.env.PR_HEAD;
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: headRef,
              base: process.env.PR_BASE,
              state: 'open'
            });

            if (existing.length > 0) {
              const pr = await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existing[0].number,
                title: prTitle,
                body: prBody
              });
              core.info('Updated PR #' + pr.data.number);
            } else {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: process.env.PR_HEAD,
                base: process.env.PR_BASE,
                title: prTitle,
                body: prBody
              });
              core.info('Created PR #' + pr.data.number);
            }
